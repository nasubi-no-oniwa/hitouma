<style>
:root{--ink:#1d1d1d;--sub:#5e6a55;--accent:#1f8a3c;--red:#e8322a;--gold:#e0a000;--card:#fffdf4}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#9fd3f0;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pad{position:fixed;left:0;right:0;bottom:0;top:44%;z-index:3;overflow:hidden;border-top:4px solid #fff;background-color:#3f9a45;background-image:repeating-linear-gradient(0deg,#ffffff00 0 38px,#ffffff2a 38px 42px,#ffffff00 42px 80px),repeating-linear-gradient(0deg,#3c9443 0 80px,#46a54d 80px 160px);touch-action:none}
#padMsg{position:absolute;left:0;right:0;top:12%;text-align:center;color:#fff;font-weight:900;font-size:26px;text-shadow:0 3px 0 #0005,0 0 10px #0006;pointer-events:none;padding:0 10px;line-height:1.3}
#padMsg small{display:block;font-size:14px;margin-top:6px;font-weight:800}
.tg{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:4px dashed #fff;background:#ffffff26;pointer-events:none;color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 3px #000a;transition:background .15s}
.tg.on{background:#ffe066aa;border-style:solid}
.fm{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;background:radial-gradient(circle,#fff8 0 40%,#fff0 70%);border:3px solid #fff;pointer-events:none;color:#1d1d1d;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
#meter{position:absolute;left:12px;right:12px;top:10px;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 2px 0 #0006}
#meterTxt{font-size:22px;text-align:center}
#meterBar{height:10px;border-radius:6px;background:#0004;margin-top:4px;overflow:hidden}
#meterBar i{display:block;height:100%;width:0;background:#ffe066}
#quitBtn{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:12;border:none;border-radius:10px;background:#fffd;font-weight:900;font-family:inherit;font-size:13px;padding:7px 11px;color:var(--ink)}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:4;pointer-events:none;text-align:center}
#hRace{display:inline-block;background:#1d1d1dd8;color:#fff;font-weight:900;font-size:14px;padding:4px 12px;border-radius:999px}
#hTime{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 2px 0 #0007,0 0 8px #0006;line-height:1.15}
#mini{position:relative;height:28px;margin:4px 14px 0;}
#mini .ln{position:absolute;left:0;right:0;top:13px;height:3px;background:#ffffffc0;border-radius:2px}
#mini .gl{position:absolute;right:-2px;top:4px;width:4px;height:20px;background:#e8322a;border-radius:2px}
#mini .dt{position:absolute;top:8px;width:13px;height:13px;margin-left:-6px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px #0006}
#mini .dt.me{width:19px;height:19px;margin-left:-9px;top:5px;border-color:#ffe066;border-width:3px;z-index:2}
#telop{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:5;text-align:center;pointer-events:none}
#telop span{display:inline-block;background:#fffef2;border:3px solid #1d1d1d;border-radius:12px;padding:8px 14px;font-weight:900;font-size:18px;box-shadow:0 4px 0 #0004;max-width:100%}
#telop span.me{background:#fff2a8}
#telop span.pop{animation:pop .3s ease-out}
#skipBtn{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:6;border:none;border-radius:10px;background:#fffd;font-weight:900;font-family:inherit;font-size:13px;padding:8px 12px;color:var(--ink)}
#big{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:54px;font-weight:900;color:#fff;text-shadow:0 4px 0 #0006,0 0 14px #0007;z-index:8;pointer-events:none;line-height:1.15;padding:0 10px}
#big small{display:block;font-size:22px;margin-top:6px}
#big.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}
.panel{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0004;padding:14px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:18px;max-width:390px;width:100%;text-align:center;max-height:100%;overflow:auto;box-shadow:0 8px 0 #0004}
.card h1{margin:0 0 4px;font-size:42px;line-height:1.1;letter-spacing:.04em}
.card h1 small{display:block;font-size:13px;color:var(--sub);margin-top:4px;letter-spacing:.2em}
.card h2{margin:0 0 8px;font-size:22px}
.card p{margin:8px 0;line-height:1.6;font-size:14px;color:var(--sub)}
.card p.tip{font-size:12px;color:#7a5a1a}
.card button{display:block;width:100%;margin-top:9px;padding:13px;border:none;border-radius:12px;font-size:17px;font-weight:800;font-family:inherit;background:var(--accent);color:#fff;cursor:pointer}
.card button small{display:block;font-size:12px;font-weight:700;opacity:.9;margin-top:2px}
.card button.q{background:#a8530f}
.card button.sub{background:#ece7da;color:var(--ink);font-size:15px}
.card button.x{background:#000;color:#fff}
.card button:disabled{opacity:.45}
.card input{width:100%;font-size:16px;border-radius:10px;border:2px solid #ccc;padding:9px;font-family:inherit;margin-top:6px;text-align:center}
.row{display:flex;gap:8px}.row button{flex:1}
#langs{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#langs button{width:auto;flex:none;padding:6px 10px;font-size:13px;margin:0;background:#eee;color:var(--ink)}
#langs button.on{background:var(--ink);color:#fff}
#qr{width:150px;height:150px;margin:8px auto 0;display:block;border:3px solid var(--ink);border-radius:10px;background:#fff}
table.dg{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0}
table.dg td{padding:7px 4px;border-bottom:1px dashed #d8d0bd;text-align:left}
table.dg td.k{color:var(--sub);font-weight:800;width:5.5em}
table.dg td.v{font-weight:900}
table.dg td.v.bad{color:#c0392b}
table.dg td.v.good{color:var(--accent)}
.suit{font-weight:900;font-size:16px;margin-top:8px}
.rr{border:2px solid #e4dcc6;border-radius:12px;padding:10px;margin:8px 0;text-align:left}
.rr .h{display:flex;justify-content:space-between;align-items:baseline;font-weight:900}
.rr .h b{font-size:15px;color:var(--sub)}
.rr .h span{font-size:30px;font-variant-numeric:tabular-nums}
.rr .h span small{font-size:14px}
.rr .pl{font-weight:900;font-size:16px}
.rr .pl.w{color:var(--gold)}
.rr .cm{font-size:13px;color:#7a3b1a;font-weight:800;margin-top:3px}
.rr .rk{font-size:12px;color:var(--accent);font-weight:900;margin-top:3px;min-height:1em}
.grade{font-size:22px;font-weight:900;margin:6px 0 2px}
.grade small{display:block;font-size:12px;color:var(--sub)}
.note{font-size:13px;min-height:1.3em}
.note.err{color:#d23}.note.ok{color:var(--accent)}
.tabs{display:flex;gap:5px;margin-bottom:6px}
.tabs button{flex:1;margin:0;padding:8px 2px;font-size:14px;background:#eee;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
table.rank{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.rank td{padding:6px 3px;border-bottom:1px solid #eee;text-align:left}
table.rank td.r{color:var(--accent);font-weight:900;width:2.6em}
table.rank td.n{max-width:10em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.rank td.c{text-align:right;font-weight:900;white-space:nowrap}
table.rank tr.me td{background:#fff2c4}
table.rank tr.mw td{background:#e7e3f0;font-weight:900}
table.rank tr.mw td.n{white-space:normal;font-size:12px}
#rankBox{max-height:52vh;overflow:auto}
.card button.vid{background:#d8352a;color:#fff}
#vidPrev{width:100%;max-height:50vh;border-radius:12px;background:#000;display:block;margin:6px 0}
#recBadge{position:fixed;left:50%;top:12%;transform:translateX(-50%);z-index:30;background:#1d1d1de6;color:#fff;font-weight:900;padding:12px 18px;border-radius:14px;font-size:15px;pointer-events:none}
@media (max-width:400px){.panel{padding:8px}.card{padding:14px 10px}}
#ogpT{position:fixed;left:4%;top:9%;z-index:20;pointer-events:none;color:#1d1d1d;font-weight:900;text-shadow:0 0 12px #fff,0 0 6px #fff,0 0 3px #fff}
#ogpT b{display:block;font-size:118px;line-height:1.05}
#ogpT i{display:block;font-style:normal;font-size:38px;margin-top:10px;color:#a8530f}
#ogpT u{display:block;text-decoration:none;font-size:34px;margin-top:8px;color:#1f6f33}
</style>

<canvas id="c"></canvas>
<div id="pad" hidden><div id="meter" hidden><div id="meterTxt"></div><div id="meterBar"><i></i></div></div><div id="padMsg"></div></div>

function pose(H,dt,o){

 if(!q){
  H.hips.position.y=.98+(o.still?0:Math.abs(Math.sin(P))*.06*amp);
  H.torso.rotation.z=-.22*amp+.25*tired+lean;H.torso.rotation.x=0;H.head.rotation.z=.15*amp-.3*tired;
  for(let i=0;i<2;i++){const ph=P+off[i+2]*Math.PI*2;const sw=o.feet?o.feet[i]:Math.sin(ph);const L=H.legs[i];
   L.j.rotation.z=sw*.75*amp*legA[i];L.k.rotation.z=o.feet?-(o.air[i]*1.2+.1):-(.25+.9*amp*(.5+.5*Math.sin(ph+1.6)));
   const A=H.arms[i];const as=o.feet?-o.feet[i]:Math.sin(ph+Math.PI);A.j.rotation.z=as*(.7+tired*.7)*amp*armA[i];A.k.rotation.z=1.2+tired*.6*Math.sin(ph*2);A.j.rotation.x=(i?-1:1)*(.08+tired*.4);}
 }else{
  const g=o.g||2,flex=g===1?Math.sin(P)*.14:g===5?Math.sin(P*1.7)*.1:0;
  H.hips.position.y=.5+(o.still?0:Math.abs(Math.sin(P*(g===1?1:2)))*.05*amp);
  H.torso.rotation.z=-1.25+flex+.15*tired+lean;H.torso.rotation.x=g===3?Math.sin(P)*.12:g===5?Math.sin(P*1.3)*.1:0;
  H.head.rotation.z=1.0-.25*tired;
  for(let i=0;i<2;i++){const ph=P+off[i]*Math.PI*2;const sw=o.feet?o.feet[i]:Math.sin(ph);const A=H.arms[i];
   A.j.rotation.z=1.25+sw*.65*amp*armA[i];A.k.rotation.z=o.feet?(o.air[i]*.9):Math.max(0,Math.sin(ph+1.6))*.8*amp;A.j.rotation.x=0;}
  for(let i=0;i<2;i++){const ph=P+off[i+2]*Math.PI*2;const sw=o.feet?o.feet[i+2]:Math.sin(ph);const L=H.legs[i];
   L.j.rotation.z=1.0+sw*.6*amp*legA[i];L.k.rotation.z=-1.75+(o.feet?-o.air[i+2]*.5:-Math.max(0,Math.sin(ph+1.6))*.5*amp);}

 }
 // つまずき・転倒・柵
 H.body.rotation.set(0,0,0);H.body.position.set(0,0,0);

}

function takeTicket(){if(PV)return Promise.resolve(Date.now());
 const once=async()=>{const a=await fbAuth();const r=await PUT(DB('last/'+a.uid)+QA(a),{t:TS});if(!r.ok)throw new Error('ticket '+r.status);const j=await r.json();let st=j&&j.t;
  if(typeof st!=='number'){const g=await fetchR(DB('last/'+a.uid+'/t')+QA(a));st=await g.json();}if(typeof st!=='number')throw new Error('ticket t');return st;};
 return (async()=>{const wait=[700,1500,2500,4000];for(let i=0;;i++){try{return await once();}catch(e){console.warn(e);if(i>=wait.length)return null;await new Promise(r=>setTimeout(r,wait[i]));}}})();}
const dayKey=ms=>Math.floor((ms+32400000)/86400000);
const DS=10000000,TOPN=100;
async function submit(){const msg=$('sendMsg');msg.textContent='';msg.className='note';
 const q=FORM.q?'q':'b';
 if(PV){RES.forEach((r,i)=>{const e=$('rk'+i);if(e&&!r.moon)e.textContent=t('sent',{d:t('rankN',{r:3+i})});});return;}
 msg.textContent=t('sending');
 try{const st=await ticketP;if(st==null){msg.textContent=t('offline');msg.className='note err';return;}const a=await fbAuth();
  if(RES.some(r=>r.moon)){await PUT(DB('mw/'+a.uid)+QA(a),{t:TS}).catch(()=>{});msg.textContent='';return;}
  const dk=dayKey(Date.now());let any=false,better=false;
  for(let i=0;i<RES.length;i++){const r=RES[i];const b=q+r.d;const k=DS-r.ms;const rec={n:myName(),f:FSTR,s:r.ms,k,st,v:1,t:TS};
   const [cur,curD]=await Promise.all([fetchR(DB('r/'+b+'/'+a.uid)+'.json').then(x=>x.ok?x.json():null).catch(()=>null),fetchR(DB('d/'+b+'/'+a.uid)+'.json').then(x=>x.ok?x.json():null).catch(()=>null)]);
   if(!cur||cur.k<k){better=true;const res=await PUT(DB('r/'+b+'/'+a.uid)+QA(a),rec);if(res.ok)any=true;}
   if(!curD||curD.dk!==dk||curD.k<k){better=true;const res=await PUT(DB('d/'+b+'/'+a.uid)+QA(a),{...rec,dk,ds:dk*DS+k});if(res.ok)any=true;}
   const rows=await loadBoard(b,'all').catch(()=>[]);const me=rows.find(x=>x.id===a.uid);const e=$('rk'+i);if(e)e.textContent=t('sent',{d:me?t('rankN',{r:me.rk}):t('rankOut')});}
  if(!better){msg.textContent=t('notbetter');}else if(!any){msg.textContent=t('senderr');msg.className='note err';}else msg.textContent='';
 }catch(e){console.warn(e);msg.textContent=t('senderr');msg.className='note err';}}
const BC={};
async function loadBoard(b,kind){const key=b+kind;if(BC[key]&&Date.now()-BC[key].t<15000)return BC[key].rows;
 const today=dayKey(Date.now());const d=+b.slice(1),q=b[0]==='q'?1:0;
 const url=kind==='d'?DB('d/'+b)+'.json?orderBy=%22ds%22&startAt='+(today*DS)+'&endAt='+(today*DS+DS-1)+'&limitToLast='+TOPN:DB('r/'+b)+'.json?orderBy=%22k%22&limitToLast='+TOPN;
 const [j,h]=await Promise.all([fetchR(url).then(r=>{if(!r.ok)throw 0;return r.json();}),fetchR(DB('hidden')+'.json').then(r=>r.ok?r.json():null).catch(()=>null)]);
 // 計算しなおして、フォームとタイムが合わない記録は出さない
 const rows=Object.entries(j||{}).map(([id,v])=>({...v,id})).filter(r=>{if(h&&h[r.id])return false;const f=S.decode(r.f);if(!f||f.q!==q||f.M)return false;const ms=S.timeOf(r.f,d);return ms!=null&&Math.abs(ms-r.s)<=60;}).sort((a,b)=>b.k-a.k||a.t-b.t);
 rows.forEach((r,i)=>{r.rk=i>0&&rows[i-1].k===r.k?rows[i-1].rk:i+1;});BC[key]={t:Date.now(),rows};return rows;}
async function mwCount(){try{const r=await fetchR(DB('mw')+'.json?shallow=true');if(!r.ok)return 0;const j=await r.json();return j?Object.keys(j).length:0;}catch(e){return 0;}}
function formShort(fs){const f=S.decode(fs);if(!f)return '';if(f.q)return t('gaits')[f.G]||'';const L=f.L,c=f.C/100;return t(L>230?'v_big':L<110?'v_small':'v_mid')+'・'+t('k_pi')+t(c>6.5?'v_fast':c<3?'v_slow':'v_mid');}
let rankFrom=false,rkB='b100',rkK='d';
async function openRank(b,kind,fromResult){if(fromResult!=null)rankFrom=!!fromResult;rkB=b||rkB;rkK=kind||rkK;show('rankPanel');
 const bt=$('bTabs');bt.innerHTML='';for(const x of S.BOARDS){const e=document.createElement('button');e.textContent=x.slice(1)+'m';if(x===rkB)e.className='on';e.onclick=()=>openRank(x,rkK);bt.appendChild(e);}
 $('tabDay').classList.toggle('on',rkK==='d');$('tabAll').classList.toggle('on',rkK==='all');$('tabDay').onclick=()=>openRank(rkB,'d');$('tabAll').onclick=()=>openRank(rkB,'all');
 const box=$('rankBox');box.innerHTML='<p>'+esc(t('loading'))+'</p>';
 const rowH=(r,me)=>'<tr'+(me?' class="me"':'')+'><td class="r">'+r.rk+'</td><td class="n">'+esc(r.n)+'<br><small style="color:var(--sub);font-size:11px">'+esc(formShort(r.f))+'</small></td><td class="c">'+esc(fmtT(r.s))+'</td></tr>';
 const mwH=n=>'<tr class="mw"><td class="r">🌙</td><td class="n">'+esc(t('mwRow'))+'</td><td class="c">'+esc(t('people',{n:n.toLocaleString()}))+'</td></tr>';
 if(PV){box.innerHTML='<table class="rank">'+mwH(12)+[['ハシルオジサン',10850],['モモアゲクイーン',11020],[myName(),11240]].map((x,i)=>rowH({rk:i+1,n:x[0],s:x[1],f:'0,2800,280,1000,170,95,50,0,0,50,0,6000'},i===2)).join('')+'</table>';return;}
 try{const [rows,mw]=await Promise.all([loadBoard(rkB,rkK),mwCount()]);const myId=(ls.get('ht_auth',null)||{}).uid;
  let h='<table class="rank">'+mwH(mw)+rows.slice(0,TOPN).map(r=>rowH(r,r.id===myId)).join('');if(!rows.length)h+='<tr><td></td><td colspan="2">'+esc(t('empty'))+'</td></tr>';box.innerHTML=h+'</table>';
 }catch(e){box.innerHTML='<p>'+esc(t('rankerr'))+'</p>';}}
$('rankBtn').onclick=()=>openRank('b100','d',false);
$('rankBack').onclick=()=>{if(rankFrom)show('result');else show('title');};
$('btnB').onclick=()=>startTrain(0);$('btnQ').onclick=()=>startTrain(1);

// ===== まわす =====
function resize(){const w=innerWidth,h=innerHeight;R3.setSize(w,h,false);CAM.aspect=w/h;CAM.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let last=performance.now();
function trainCam(raw){const x=TRH?TRH.root.position.x:0;const w=innerWidth,h=innerHeight,por=w<h;
 CAM.fov=por?62:46;CAM.aspect=w/h;
 const fq=TQ?1:1.25;CAM.position.set(x-(por?3.5:3.6)*fq,(por?1.7:1.5)*fq,(por?3.6:3.4)*fq);CAM.lookAt(x+.4,TQ?.6:.9,0);CAM.rotateX(por?-.27:-.12);CAM.updateProjectionMatrix();}
function trainAnim(raw){if(!TRH)return;const d=trainDist();TRH.root.position.x=lerp(TRH.root.position.x,Math.min(S.TRAIN[TQ?'q':'b'],d),1-Math.exp(-raw*12));
 const feet=[],air=[];const n=TQ?4:2;
 for(let i=0;i<n;i++){const L=legs[i];if(!L)continue;if(!L.down){L.foot=lerp(L.foot,1,1-Math.exp(-raw*10));L.air=lerp(L.air,0,1-Math.exp(-raw*6));}else L.air=lerp(L.air,0,1-Math.exp(-raw*14));feet.push(L.foot);air.push(L.down?0:Math.max(.25,L.air));}
 if(mode!=='train'){for(let i=0;i<n;i++){feet[i]=lerp(feet[i]||0,0,.1);air[i]=0;}}
 pose(TRH,raw,{amp:1,feet,air,g:2,still:true});}
let ogpReady=false;
const TSC=+(Q.get('ts')||1);
const STEP=Q.has('step');
function loop(now){requestAnimationFrame(loop);const raw=Math.min(.1,Math.max(0,(now-last)/1000))*TSC;last=now;frame(raw);}
function frame(raw){mT+=raw;telT+=raw;
 if(mode==='trained'&&FORM&&mT>1.1&&!STEP)showDiag();
 if(mode==='few'&&mT>1.3)startTrain(TQ);
 CAM.clearViewOffset&&mode!=='setup'&&mode!=='count'&&mode!=='train'&&mode!=='trained'&&CAM.view&&CAM.clearViewOffset();
 if(mode==='video')return;
 if(mode==='count'&&mT>.9)beginWalk();
 if(mode==='race')raceUpdate(raw);
 else if(mode==='setup'||mode==='count'||mode==='train'||mode==='trained'){trainAnim(raw);trainCam(raw);}
 else if(mode==='title'||mode==='diag'||mode==='result'||mode==='ogp'){
  if(SCEN.length){for(const h of SCEN){h.ph+=raw*(h.quad?1.3:1.6);h.root.position.x+=raw*(h.quad?2.6:2.2);if(h.root.position.x>140)h.root.position.x=40;pose(h,raw,{amp:.8,g:1});}
   const x=SCEN[0].root.position.x;const por=innerWidth<innerHeight;CAM.fov=por?55:40;CAM.position.set(x+(por?2.5:4),1.4,por?-6.5:-6);CAM.lookAt(x-.5,.8,0);CAM.rotateX(por?-.12:0);CAM.updateProjectionMatrix();}
  else if(RUN.length){camRace(RACE?RACE.t:0,raw);}}
 if(mode==='train'&&mT>40)finishTrain();
 R3.render(SC,CAM);}
camInit=false;
// ===== OGP・アイコン =====
if(OGP||ICON){mode='ogp';document.body.style.background='transparent';clearRunners();buildTrack(200,'race');
 const a=makeHuman(SILKS[0],true,1,null),b=makeHuman(SILKS[1],false,2,null);a.root.position.set(100,0,.4);b.root.position.set(97.2,0,-2.4);SC.add(a.root);SC.add(b.root);SCEN=[];
 a.ph=.3;b.ph=.15;pose(a,0,{amp:1,g:1});pose(b,0,{amp:1});
 const w=innerWidth,h=innerHeight;if(OGP){CAM.fov=30;CAM.position.set(104.6,1.35,5.4);CAM.lookAt(99.3,.75,-.7);CAM.rotateY(.30);}else{CAM.fov=30;CAM.position.set(103.6,1.0,2.6);CAM.lookAt(100.0,.6,0);}CAM.updateProjectionMatrix();
 if(OGP){const o=$('ogpT');o.hidden=false;o.innerHTML='<b>'+esc(t('title'))+'</b><i>'+esc(t('sub'))+'</i><u>'+esc(lang==='ja'?'指で歩いて、走りを覚えさせろ':t('btnBs'))+'</u>';}
 R3.render(SC,CAM);window.__OGP_READY=true;}
else{applyLang();showTitle();if(!STEP)requestAnimationFrame(loop);}
window.__HT={step:dt=>frame(dt),diagWith:fs=>{FSTR=fs;FORM=S.decode(fs);TQ=FORM.q;showDiag();},CAM,TRHf:()=>TRH,demo:(fs)=>{FSTR=fs;FORM=S.decode(fs);TQ=FORM.q;ticketP=takeTicket();ghostP=loadGhosts();startRaces();},get mode(){return mode;},get form(){return FSTR;},get res(){return RES;},S,startTrain,showDiag,startRaces,get race(){return RACE;},openRank,setLang:k=>{lang=k;applyLang();}};
</script>
